; Pubblicità. Gli unit ID di test di Google mostrano annunci veri con la scritta "Test Ad",
; non generano ricavi e non violano le policy. La sezione [production] contiene gli ID del conto
; AdMob del gioco e viene usata SOLO nelle build release: in editor, nei test e in ogni APK di
; debug il gioco resta sugli ID di test (OS.is_debug_build), perché un annuncio vero mostrato al
; proprio telefono è traffico non valido e AdMob sospende l'account.
; test=true forza gli ID di test anche in release. L'App ID (quello con la tilde ~) sta in
; project.godot, sezione [admob], voce general/android/app_id.

[ads]
test=false

