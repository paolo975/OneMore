; Pubblicità. Con test=true il gioco usa gli ID di prova ufficiali di Google:
; annunci veri, con la scritta "Test Ad", che non generano ricavi e non violano le policy.
; Per la produzione: metti test=false e incolla gli ID del tuo account AdMob qui sotto.
; L'App ID (quello con la tilde ~) va invece in project.godot, sezione [admob], voce app_id.
; Non usare mai gli ID di produzione in una build di debug: AdMob sospende l'account.

[ads]
test=true

[test]
banner="ca-app-pub-3940256099942544/6300978111"
interstitial="ca-app-pub-3940256099942544/1033173712"

