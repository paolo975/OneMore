[it]
title="Ancora uno!"
short="Riempi l'ascensore di animali prima che le porte si chiudano"
full="Un ascensore da 25 caselle, una banda di animali e le porte che si chiudono da sole: riesci a farli salire tutti?\n\nTocca un animale per girarlo, trascinalo dentro per farlo salire. Ogni piano chiede un minimo di caselle prima che le porte si chiudano, e ogni animale in più vale punti. Dal secondo piano il pavimento è ingombro di valigie, piante e scatole: gli incastri contano davvero. Alla partenza una, due o tre stelle dicono quanto hai riempito l'ascensore, e salendo entrano in scena nuovi amici.\n\nPensato per bambini dai 4 ai 6 anni: niente da leggere, tutto si capisce guardando. Un tocco, un trascinamento, e via.\n\n• Dino Bronto, Panda Pip, Cocco Crunch, Giraffa Gigi, Triceratò, e ai piani alti Elefante Elmo e Tartaruga Tea\n• Piani sempre diversi: bagagli sul pavimento, forme più grandi man mano che si sale\n• Stelle a ogni partenza e una festa quando arriva un animale nuovo\n• Musica e suoni originali, disattivabili con un tocco\n• Tre vite, un record salvato sul dispositivo, nessun account\n• In italiano e in inglese, secondo la lingua del telefono\n\nIl gioco mostra annunci adatti ai bambini, non personalizzati: un banner durante la partita e uno schermo intero alla fine della partita."
caption_1="Un ascensore. Una banda bestiale."
caption_2="Trascina gli animali dentro prima che le porte si chiudano"
caption_3="Riempilo tutto: tre stelle!"
caption_4="Salendo di piano arrivano nuovi amici"
caption_5="Perso? Ancora uno!"

[en]
title="One more!"
short="Fill the lift with animals before the doors close"
full="A 25-cell lift, a bunch of animals and doors that close on their own: can you get them all aboard?\n\nTap an animal to turn it, drag it in to board. Every floor asks for a minimum of cells before the doors close, and every extra animal scores. From the second floor the lift is cluttered with suitcases, plants and boxes: fitting things together really matters. On departure one, two or three stars show how full the lift was, and new friends join the gang as you go up.\n\nMade for children aged 4 to 6: nothing to read, everything is clear at a glance. One tap, one drag, off you go.\n\n• Bronto Dino, Pip Panda, Crunch Croc, Gigi Giraffe, Tricera-Tops, and on the upper floors Elmo Elephant and Tea Tortoise\n• Every floor is different: luggage on the floor, bigger shapes the higher you go\n• Stars at every departure and a celebration when a new animal arrives\n• Original music and sounds, muted with one tap\n• Three lives, a best score kept on the device, no account\n• In Italian and English, following the phone's language\n\nThe game shows child-appropriate, non-personalised ads: a banner during play and a full-screen ad when a game ends."
caption_1="One lift. One wild bunch."
caption_2="Drag the animals in before the doors close"
caption_3="Fill it all up: three stars!"
caption_4="New friends join on the way up"
caption_5="Lost? One more!"
